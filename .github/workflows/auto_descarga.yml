name: Descargar y Notificar UPS Surcharge

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install playwright pdfplumber pandas openpyxl
          playwright install --with-deps chromium

      - name: Descargar, generar Excel y enviar correo
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          DESTINATARIO: Jose.Mon@mirgor.com
        run: python descargar.py

      - name: Guardar archivos nuevos en el repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add descargas/
          git diff --staged --quiet || git commit -m "Actualización automática UPS Surcharge (PDF + Excel)"
          git push
