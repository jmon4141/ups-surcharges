name: Descargar UPS Surcharge

on:
  schedule:
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright y Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Ejecutar script de descarga
        run: python descargar.py

      - name: Guardar archivo nuevo en el repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add descargas/
          git diff --staged --quiet || git commit -m "Actualización automática UPS Surcharge"
          git push
