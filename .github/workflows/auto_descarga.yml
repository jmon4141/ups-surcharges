name: Descargar y Notificar UPS Surcharge

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      forzar_envio:
        description: 'Forzar envío de correo y guardado aunque el archivo no haya cambiado'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  descargar-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install playwright pdfplumber pandas openpyxl
          playwright install --with-deps chromium

      - name: Ejecutar script de descarga y generar Excel
        id: descarga
        env:
          FORZAR_ENVIO: ${{ inputs.forzar_envio }}
        run: python descargar.py

      - name: Enviar correo con PDF y Excel actualizados
        if: steps.descarga.outputs.enviar == 'true'
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          ARCHIVO_PDF: ${{ steps.descarga.outputs.archivo_path }}
          ARCHIVO_XLSX: ${{ steps.descarga.outputs.excel_path }}
          NOMBRE_ARCHIVO: ${{ steps.descarga.outputs.archivo_nombre }}
        run: |
          python - <<'EOF'
          import mimetypes
          import os
          import smtplib
          from email.message import EmailMessage

          msg = EmailMessage()
          msg["Subject"] = f"Actualización UPS IAF Surcharge - {os.environ['NOMBRE_ARCHIVO']}"
          msg["From"] = os.environ["MAIL_USER"]
          msg["To"] = "monjoseignacio@gmail.com"
          msg.set_content("Se adjuntan el PDF descargado de UPS y el Excel procesado.")

          for ruta in (os.environ["ARCHIVO_PDF"], os.environ["ARCHIVO_XLSX"]):
              if ruta and os.path.exists(ruta):
                  ctype, _ = mimetypes.guess_type(ruta)
                  maintype, subtype = (ctype or "application/octet-stream").split("/", 1)
                  with open(ruta, "rb") as f:
                      msg.add_attachment(
                          f.read(),
                          maintype=maintype,
                          subtype=subtype,
                          filename=os.path.basename(ruta),
                      )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(os.environ["MAIL_USER"], os.environ["MAIL_PASS"].replace(" ", ""))
              smtp.send_message(msg)

          print("Correo enviado correctamente a monjoseignacio@gmail.com")
          EOF

      - name: Guardar archivos nuevos en el repositorio
        if: steps.descarga.outputs.enviar == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add descargas/
          git diff --staged --quiet || git commit -m "Actualización automática UPS Surcharge (PDF + Excel)"
          git push
