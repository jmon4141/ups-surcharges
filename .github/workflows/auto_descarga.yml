name: Descargar y Notificar UPS Surcharge

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install playwright pdfplumber pandas openpyxl
          playwright install --with-deps chromium

      - name: Ejecutar script de descarga y generar Excel
        id: descarga
        run: python descargar.py

      - name: Enviar correo con PDF y Excel actualizados
        if: steps.descarga.outputs.cambio == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "Actualización UPS IAF Surcharge - ${{ steps.descarga.outputs.archivo_nombre }}"
          to: Jose.Mon@mirgor.com
          from: "Automatización UPS <${{ secrets.MAIL_USER }}>"
          body: |
            Se detectó una actualización en la tabla de IAF Surcharges de UPS.
            Se adjuntan el PDF original y el Excel procesado (hojas Matriz_Original y Tabla_Plana).
          attachments: |
            ${{ steps.descarga.outputs.archivo_path }}
            ${{ steps.descarga.outputs.excel_path }}

      - name: Guardar archivos nuevos en el repositorio
        if: steps.descarga.outputs.cambio == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add descargas/
          git diff --staged --quiet || git commit -m "Actualización automática UPS Surcharge (PDF + Excel)"
          git push
